# DOVA en Render — versión GRATIS, solo para PROBAR.
#   - La base de datos gratis se BORRA a los 30 días de creada.
#   - El servidor se apaga tras 15 min sin uso (el primer ingreso tarda ~1 min).
#   - Sin disco: fotos/estudios/adjuntos subidos se pierden en cada actualización.
# Para uso real en la clínica: Blueprint Path = render-pago.yaml (planes pagos).
# Uso: Render → New → Blueprint (este es el archivo por defecto).
services:
  - type: web
    name: dova
    runtime: node
    plan: free
    region: virginia
    # En el plan gratis no existe preDeployCommand: la base se prepara en el build.
    buildCommand: cd backend && npm ci && npm run migrate:up && npm run seed
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dova-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Sesiones (ver SECURITY-AUDIT.md): sin uso 7 días se pide ingresar de nuevo;
      # ninguna sesión dura más de 30 días desde el login.
      - key: SESSION_IDLE_TIMEOUT_DAYS
        value: "7"
      - key: SESSION_ABSOLUTE_MAX_DAYS
        value: "30"
      # Render siempre sirve por https: las cookies de sesión van siempre con Secure.
      - key: COOKIES_SIEMPRE_SECURE
        value: "true"
      # Usuario de base con MÍNIMO PRIVILEGIO (opcional, se configura a mano,
      # ver SECURITY-AUDIT.md → "Base de datos"): agregar APP_DATABASE_URL con el
      # usuario dova_app. DATABASE_URL (dueño) queda solo para migraciones y seed.
      - key: DOVA_TZ
        value: America/Asuncion
      # Email OPCIONAL (solo avisos de pagos a pacientes; las cuentas no lo necesitan).
      # El plan gratis de Render BLOQUEA el SMTP: se usa Brevo (brevo.com) por su API web.
      # BREVO_API_KEY y MAIL_REMITENTE se completan a mano en Render → dova → Environment.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_REMITENTE
        sync: false
      - key: MAIL_NOMBRE
        value: DentCare
      # Recordatorios de turnos por WhatsApp Business (OPCIONAL, ver docs/WHATSAPP.md).
      # Sin estas variables, los recordatorios se mandan desde el WhatsApp de la recepción.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PLANTILLA
        value: recordatorio_turno
      # Avisos de cobro (cuotas y presupuestos): plantillas aprobadas en Meta (ver docs/WHATSAPP.md).
      - key: WHATSAPP_PLANTILLA_PAGO
        value: aviso_pago
      - key: WHATSAPP_PLANTILLA_PRESUPUESTO
        value: seguimiento_presupuesto
      - key: WHATSAPP_IDIOMA
        value: es
      # Clave del disparo programado (GitHub la usa como DOVA_CRON_SECRET).
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: dova-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: dova
    user: dova
