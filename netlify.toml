[build]
  # Publica la carpeta frontend/ completa: mecanico/ (entrada) y app/ (todo el código).
  publish = "frontend"
  # Genera app/core/config.js con la URL real del backend a partir de la
  # variable de entorno DOVA_API_URL (configurala en Netlify > Site
  # settings > Environment variables, ej: https://dova-backend.onrender.com/api
  # si el backend está desplegado en Render — ver README > Deploy backend
  # en Render). Si no está seteada, cae al localhost de desarrollo (no
  # rompe un build de prueba, pero en producción real hay que configurarla).
  command = "sed \"s#__DOVA_API_URL__#${DOVA_API_URL:-http://localhost:4000/api}#\" frontend/app/core/config.template.js > frontend/app/core/config.js"

# Raíz del sitio -> DOVA (único diseño: mecánico). Los enlaces viejos a los otros diseños llevan al actual.
[[redirects]]
  from = "/"
  to = "/mecanico/"
  status = 302
[[redirects]]
  from = "/mecanico"
  to = "/mecanico/"
  status = 301
[[redirects]]
  from = "/moderno/*"
  to = "/mecanico/"
  status = 301
[[redirects]]
  from = "/minimalista/*"
  to = "/mecanico/"
  status = 301
[[redirects]]
  from = "/tecnico/*"
  to = "/mecanico/"
  status = 301
[[redirects]]
  from = "/mecanico/*"
  to = "/mecanico/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# App instalable: el service worker y el manifiesto siempre frescos.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
